    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, Arial, sans-serif; }
      .line { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 3.5s ease-out forwards infinite; }
