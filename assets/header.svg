<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Yasin Gülsoy</title>
  <desc id="desc">Full-stack geliştirici. .NET, Next.js ve veri odaklı iş uygulamaları.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#160f2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a78bfa;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#a78bfa;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .role { opacity: 0; animation: cycle 9s infinite; }
      .r2 { animation-delay: 3s; }
      .r3 { animation-delay: 6s; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(8px); }
        4%, 30% { opacity: 1; transform: translateY(0); }
        34%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out infinite reverse; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
      @media (prefers-reduced-motion: reduce) {
        .role, .caret, .float, .float2, .scan { animation: none; }
        .r1 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="980" cy="70" r="220" fill="url(#glowB)"/>
    <circle cx="160" cy="300" r="200" fill="url(#glowA)"/>
    <rect class="scan" x="0" y="0" width="140" height="320" fill="#ffffff" fill-opacity="0.025"/>

    <!-- terminal penceresi -->
    <g transform="translate(790 62)"><g class="float">
      <rect width="340" height="196" rx="14" fill="#0b1226" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="20" r="5" fill="#f87171"/>
      <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
      <circle cx="58" cy="20" r="5" fill="#34d399"/>
      <text x="320" y="24" text-anchor="end" class="mono" font-size="12" fill="#64748b">~/yasingulsoy</text>
      <g class="mono" font-size="14">
        <text x="22" y="62" fill="#94a3b8">$ <tspan fill="#e2e8f0">dotnet new mvc</tspan></text>
        <text x="22" y="90" fill="#94a3b8">$ <tspan fill="#e2e8f0">npx create-next-app</tspan></text>
        <text x="22" y="118" fill="#94a3b8">$ <tspan fill="#e2e8f0">git push origin main</tspan></text>
        <text x="22" y="146" fill="#34d399">✓ deployed</text>
        <text x="22" y="174" fill="#94a3b8">$ <tspan class="caret" fill="#38bdf8">▍</tspan></text>
      </g>
    </g></g>
    <g transform="translate(1120 40)"><g class="float2">
      <text class="mono" font-size="26" fill="#a78bfa" fill-opacity="0.55">&lt;/&gt;</text>
    </g></g>

    <!-- metin -->
    <text x="64" y="92" class="sans" font-size="20" fill="#94a3b8" letter-spacing="0.5">Merhaba, ben</text>
    <text x="62" y="160" class="sans" font-size="64" font-weight="800" fill="url(#name)">Yasin Gülsoy</text>
    <text x="64" y="202" class="sans" font-size="22" fill="#cbd5e1">Full-Stack Developer · Bilgisayar Mühendisi</text>

    <g class="mono" font-size="17">
      <text x="64" y="252" fill="#64748b">// şu sıralar</text>
      <text class="role r1" x="214" y="252" fill="#38bdf8">.NET ile iş uygulamaları geliştiriyorum</text>
      <text class="role r2" x="214" y="252" fill="#a78bfa">Next.js ile modern web arayüzleri kuruyorum</text>
      <text class="role r3" x="214" y="252" fill="#f472b6">veriyi rapora ve karara dönüştürüyorum</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
