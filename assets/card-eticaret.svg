<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="t d">
  <title id="t">E-Ticaret Bitirme Projesi</title>
  <desc id="d">Admin panelli, Iyzico ödemeli e-ticaret sitesi. ASP.NET Core, EF Core, SQL Server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a1f"/>
      <stop offset="1" stop-color="#1c0f30"/>
    </linearGradient>
    <clipPath id="c"><rect width="400" height="220" rx="16"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, Arial, sans-serif; }
      .drop { animation: drop 4s ease-in infinite; }
      .drop2 { animation-delay: 1.3s; }
      .drop3 { animation-delay: 2.6s; }
      @keyframes drop { 0% { transform: translateY(-40px); opacity: 0; } 15% { opacity: 1; } 45%, 100% { transform: translateY(0); opacity: 0; } }
      .badge { animation: pop 4s ease-in-out infinite; transform-origin: 352px 98px; }
      @keyframes pop { 0%, 40% { transform: scale(1); } 48% { transform: scale(1.25); } 56%, 100% { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .drop, .badge { animation: none; } .drop { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text x="24" y="40" class="sans" font-size="22" font-weight="700" fill="#f5f3ff">E-Ticaret</text>
    <text x="24" y="64" class="sans" font-size="13.5" fill="#94a3b8">Admin panelli, Iyzico ödemeli bitirme projesi</text>

    <!-- düşen ürünler ve sepet -->
    <g transform="translate(0 0)">
      <rect class="drop" x="292" y="86" width="16" height="16" rx="3" fill="#a78bfa"/>
      <rect class="drop drop2" x="312" y="86" width="16" height="16" rx="3" fill="#f472b6"/>
      <rect class="drop drop3" x="302" y="86" width="16" height="16" rx="3" fill="#38bdf8"/>
    </g>
    <path d="M258 100 h16 l14 52 h58 l12 -38 h-78" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="296" cy="166" r="7" fill="#c4b5fd"/>
    <circle cx="338" cy="166" r="7" fill="#c4b5fd"/>
    <g class="badge">
      <circle cx="352" cy="98" r="12" fill="#f472b6"/>
      <text x="352" y="103" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#ffffff">3</text>
    </g>

    <g class="sans" font-size="11.5" font-weight="600">
      <rect x="24" y="186" width="104" height="22" rx="11" fill="#a78bfa" fill-opacity="0.16"/>
      <text x="76" y="201" text-anchor="middle" fill="#c4b5fd">ASP.NET Core</text>
      <rect x="134" y="186" width="70" height="22" rx="11" fill="#a78bfa" fill-opacity="0.16"/>
      <text x="169" y="201" text-anchor="middle" fill="#c4b5fd">EF Core</text>
      <rect x="210" y="186" width="88" height="22" rx="11" fill="#a78bfa" fill-opacity="0.16"/>
      <text x="254" y="201" text-anchor="middle" fill="#c4b5fd">SQL Server</text>
    </g>
    <rect x="0.5" y="0.5" width="399" height="219" rx="15.5" fill="none" stroke="#a78bfa" stroke-opacity="0.25"/>
  </g>
</svg>
