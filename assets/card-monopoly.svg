<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="t d">
  <title id="t">İstanbul Monopoly</title>
  <desc id="d">Sesli sohbetli, çok oyunculu İstanbul temalı tahta oyunu. Next.js, Node.js, TypeScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1206"/>
      <stop offset="1" stop-color="#24170a"/>
    </linearGradient>
    <clipPath id="c"><rect width="400" height="220" rx="16"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, Arial, sans-serif; }
      .token { animation: move 6s ease-in-out infinite; }
      @keyframes move {
        0%, 10% { transform: translate(0px, 0px); }
        25%, 35% { transform: translate(84px, 0px); }
        50%, 60% { transform: translate(84px, 56px); }
        75%, 85% { transform: translate(0px, 56px); }
        100% { transform: translate(0px, 0px); }
      }
      .die { animation: roll 3s ease-in-out infinite; transform-origin: 340px 128px; }
      @keyframes roll { 0%, 70%, 100% { transform: rotate(0deg); } 80% { transform: rotate(-14deg); } 90% { transform: rotate(10deg); } }
      @media (prefers-reduced-motion: reduce) { .token, .die { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text x="24" y="40" class="sans" font-size="22" font-weight="700" fill="#fffbeb">İstanbul Monopoly</text>
    <text x="24" y="64" class="sans" font-size="13.5" fill="#94a3b8">Sesli sohbetli, çok oyunculu tahta oyunu</text>

    <!-- mini tahta -->
    <g transform="translate(200 82)">
      <g fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.35">
        <rect x="0" y="0" width="28" height="28" rx="4"/><rect x="28" y="0" width="28" height="28" rx="4"/><rect x="56" y="0" width="28" height="28" rx="4"/><rect x="84" y="0" width="28" height="28" rx="4"/>
        <rect x="84" y="28" width="28" height="28" rx="4"/><rect x="84" y="56" width="28" height="28" rx="4"/>
        <rect x="56" y="56" width="28" height="28" rx="4"/><rect x="28" y="56" width="28" height="28" rx="4"/><rect x="0" y="56" width="28" height="28" rx="4"/>
        <rect x="0" y="28" width="28" height="28" rx="4"/>
      </g>
      <rect x="0" y="0" width="28" height="6" fill="#f87171"/>
      <rect x="56" y="0" width="28" height="6" fill="#60a5fa"/>
      <rect x="84" y="56" width="28" height="6" fill="#34d399"/>
      <circle class="token" cx="14" cy="16" r="7" fill="#fbbf24" stroke="#1a1206" stroke-width="2"/>
    </g>
    <g class="die">
      <rect x="322" y="110" width="36" height="36" rx="8" fill="#fffbeb"/>
      <circle cx="331" cy="119" r="3" fill="#1a1206"/><circle cx="340" cy="128" r="3" fill="#1a1206"/><circle cx="349" cy="137" r="3" fill="#1a1206"/>
    </g>

    <g class="sans" font-size="11.5" font-weight="600">
      <rect x="24" y="186" width="70" height="22" rx="11" fill="#fbbf24" fill-opacity="0.14"/>
      <text x="59" y="201" text-anchor="middle" fill="#fcd34d">Next.js</text>
      <rect x="100" y="186" width="72" height="22" rx="11" fill="#fbbf24" fill-opacity="0.14"/>
      <text x="136" y="201" text-anchor="middle" fill="#fcd34d">Node.js</text>
      <rect x="178" y="186" width="88" height="22" rx="11" fill="#fbbf24" fill-opacity="0.14"/>
      <text x="222" y="201" text-anchor="middle" fill="#fcd34d">TypeScript</text>
    </g>
    <rect x="0.5" y="0.5" width="399" height="219" rx="15.5" fill="none" stroke="#fbbf24" stroke-opacity="0.25"/>
  </g>
</svg>
